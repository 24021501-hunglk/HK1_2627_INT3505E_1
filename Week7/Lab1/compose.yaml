services:
  api:
    build: .
    container_name: lab1-api
    ports:
      - "5000:5000"
    environment:
      SECRET_KEY: "change-this-secret-in-production"
      DATABASE_URL: "sqlite:////app/instance/products.db"
    volumes:
      - product_data:/app/instance
    restart: unless-stopped

volumes:
  product_data: